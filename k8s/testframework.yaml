apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-backend
  template:
    metadata:
      labels:
        app: test-backend
    spec:
      nodeSelector:
        role: testframework
      containers:
      - name: test-backend
        image: 264138468394.dkr.ecr.us-east-1.amazonaws.com/agentmem-test-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: AMS_URL
          value: "http://agentmem-server:8080"
        - name: OIDC_AUTH_ENABLED
          value: "false"
        - name: AMS_MTLS_ENABLED
          value: "false"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: test-backend
spec:
  type: LoadBalancer
  selector:
    app: test-backend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-ui
  template:
    metadata:
      labels:
        app: test-ui
    spec:
      nodeSelector:
        role: testframework
      containers:
      - name: test-ui
        image: 264138468394.dkr.ecr.us-east-1.amazonaws.com/agentmem-test-ui:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: test-ui
spec:
  type: LoadBalancer
  selector:
    app: test-ui
  ports:
  - port: 80
    targetPort: 3000
