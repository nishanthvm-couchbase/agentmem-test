apiVersion: v1
kind: ConfigMap
metadata:
  name: agentmem-config
data:
  AGENTMEM_CONN_STRING: "couchbase://couchbase"
  AGENTMEM_BUCKET: "agent"
  AGENTMEM_EMBEDDING_MODEL: "text-embedding-3-small"
  AGENTMEM_LLM_MODEL: "gpt-4o-mini"
  AGENTMEM_SERVER_HOST: "0.0.0.0"
  AGENTMEM_SERVER_PORT: "8080"
  AGENTMEM_EXTRACT_SEMANTIC: "true"
  AGENTMEM_MEMORY_MONITOR: "false"
  OIDC_AUTH_ENABLED: "false"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: Secret
metadata:
  name: agentmem-secrets
type: Opaque
stringData:
  AGENTMEM_USERNAME: ""
  AGENTMEM_PASSWORD: ""
  OPENAI_API_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentmem-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentmem-server
  template:
    metadata:
      labels:
        app: agentmem-server
    spec:
      nodeSelector:
        role: agentmem
      containers:
      - name: agentmem-server
        image: 264138468394.dkr.ecr.us-east-1.amazonaws.com/agentmem-server:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: agentmem-config
        - secretRef:
            name: agentmem-secrets
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: agentmem-server
spec:
  selector:
    app: agentmem-server
  ports:
  - port: 8080
    targetPort: 8080
